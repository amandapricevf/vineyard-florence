[build]
  command = "chmod +x source/scripts/*.sh && npm run build"
  publish = "deploy"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/sermons-snapshot.json"]

# The Events page moved to /eventspage (its old Squarespace address).
# Old /events links and bookmarks forward there. This matches /events exactly,
# so pages under /events/ (such as the Turkey Dinner Giveaway QR page) are not
# affected. `force` makes it win over any leftover built /events page.
[[redirects]]
  from = "/events"
  to = "/eventspage"
  status = 301
  force = true

# The Vineyard Freedom page moved to the address printed on its QR code.
# Old links forward there.
[[redirects]]
  from = "/ministries/vineyard-freedom"
  to = "/ministries/vineyard-freedom-ministry"
  status = 301
  force = true

# Old addresses printed in QR codes on church graphics. They forward to where
# each QR code should now go, so the printed codes keep working.
# Join a House Group graphic -> Church Center groups.
[[redirects]]
  from = "/house-groups-1/rjqqqliqrsqxd8oatpfeoffwdhvn7s-eepc7"
  to = "https://vineyardflorence.churchcenter.com/groups"
  status = 301
  force = true

# Leah's House graphic -> Amazon wish list.
[[redirects]]
  from = "/events/5n8h7sx5x8g7kqzkhqb0e925i2mrs8"
  to = "https://www.amazon.com/hz/wishlist/ls/KBYEDFA8051Z/ref=hz_ls_biz_ex"
  status = 301
  force = true
